<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Brain Terry — Cozy Quiz Party</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-noise"></div>
    <header class="site-header minimal">
      <div class="logo-wrap">
        <img src="assets/logo.svg" alt="Big Brain Terry logo" class="logo" />
        <h1>Big Brain Terry</h1>
      </div>
      <div class="hero-actions">
        <button id="start-featured" class="btn primary">Start Quiz</button>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="quiz-grid" id="quiz-grid"></div>
      </section>
    </main>

    <div id="quiz-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" id="quiz-frame">
        <button class="modal-close" id="close-quiz" aria-label="Close">×</button>
        <div id="quiz-stage"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
