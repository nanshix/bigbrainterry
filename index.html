<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Brain Terry</title>
    <link rel="stylesheet" href="styles/core.css" />
    <link rel="stylesheet" href="styles/flags.css" />
  </head>
  <body>
    <div id="home-screen" class="home-screen">
      <div class="hero-bg" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="hero-grid"></div>
      </div>
      <button id="fullscreen-btn" class="home-fs-btn" aria-label="Toggle fullscreen">⛶</button>

      <!-- Hero zone -->
      <div class="hero-content">
        <div class="brand">
          <img src="assets/logo.svg" alt="" class="brand-logo" />
          <div class="brand-name">
            <span class="brand-big">Big Brain</span>
            <span class="brand-terry">Terry</span>
          </div>
        </div>
        <button id="start-btn" class="play-orb" aria-label="Start quiz">
          <span class="play-icon">▶</span>
        </button>
      </div>

      <!-- Category strip -->
      <div class="cat-strip-wrap">
        <div class="cat-strip">
          <button id="shuffle-btn" class="cat-shuffle active" aria-label="Shuffle mode — click to toggle">🎲</button>
          <div id="cat-row" class="cat-strip-items"></div>
        </div>
      </div>
    </div>

    <div id="quiz-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" id="quiz-frame">
        <!-- World map background -->
        <div class="map-bg" aria-hidden="true">
          <img src="assets/worldmap169.png" alt="" class="map-img" />
        </div>
        <!-- SVG country highlight overlay (paths added dynamically) -->
        <svg id="map-highlight-svg" class="map-highlight-svg" viewBox="0 0 1000 562" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="quiz-stage"></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
